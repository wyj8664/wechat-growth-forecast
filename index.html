  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;账号与观察期&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;text-end&quot;&gt;9/26 粉丝&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;text-end&quot;&gt;整号净增&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;text-end&quot;&gt;投流花费&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;text-end&quot;&gt;投流新增阅读&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;text-end&quot;&gt;投流后台关注&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody id=&quot;wgu-evidence&quot;&gt;&lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;“投流后台关注”是严格归因口径，不能等同于该篇文章或整号实际新增；整号净增已经包含自然流、加热和后续推荐。&lt;/p&gt;

  &lt;div class=&quot;wgu-note text-small&quot; id=&quot;wgu-note&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wechat-growth-unified&#x27;);
      if (!root) return;
      const accounts = [
        { id: &#x27;wan&#x27;, name: &#x27;万联万象&#x27;, window: &#x27;9/1—9/20&#x27;, fans: 14219, net: 1550, spend: 1300, paidReads: 36188, paidFollows: 120, sampleDays: 20, tone: &#x27;var(--viz-series-1)&#x27; },
        { id: &#x27;multi&#x27;, name: &#x27;多空象限&#x27;, window: &#x27;9/1—9/26&#x27;, fans: 4130, net: 1288, spend: 1875, paidReads: 45067, paidFollows: 40, sampleDays: 26, tone: &#x27;var(--viz-series-2)&#x27; },
        { id: &#x27;chan&#x27;, name: &#x27;产联社&#x27;, window: &#x27;9/17—9/26&#x27;, fans: 10049, net: 118, spend: 700, paidReads: 19675, paidFollows: 5, sampleDays: 10, tone: &#x27;var(--viz-series-3)&#x27; },
        { id: &#x27;new&#x27;, name: &#x27;新质动能&#x27;, window: &#x27;9/1—9/26&#x27;, fans: 11061, net: 472, spend: 1963, paidReads: 49508, paidFollows: 42, sampleDays: 26, tone: &#x27;var(--viz-series-4)&#x27; }
      ];
      const periods = { 6: { days: 182, posts: 104, label: &#x27;6 个月&#x27; }, 9: { days: 273, posts: 156, label: &#x27;9 个月&#x27; }, 12: { days: 365, posts: 209, label: &#x27;1 年&#x27; } };
      const scenarios = {
        optimistic: { halfAtSixMonths: 300000 },
        base: { halfAtSixMonths: 120000 },
        cautious: { halfAtSixMonths: 40000 }
      };
      const state = { period: 6, naturalShare: 0.5, marginalRatio: 1, scenario: &#x27;base&#x27;, budgets: { wan: 10400, multi: 10400, chan: 10400, new: 10400 } };
      const maxBudget = 200000;
      const svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
      const el = id =&gt; root.querySelector(`#wgu-${id}`);
      const money = value =&gt; `${(value / 10000).toFixed(2)} 万元`;
      const yuan = value =&gt; `${value.toLocaleString(&#x27;zh-CN&#x27;)} 元`;
      const fansText = value =&gt; `${(value / 10000).toFixed(2)} 万粉`;

      function rates(account) {
        return { dailyNet: account.net / account.sampleDays };
      }
      function estimate(account, budget, days) {
        const r = rates(account);
        const baselineSpend = Object.values(periods).find(period =&gt; period.days === days).posts * 100;
        const natural = state.naturalShare * r.dailyNet * days;
        const paidAtBaseline = (1 - state.naturalShare) * r.dailyNet * days;
        let paid;
        if (budget &lt;= baselineSpend) {
          paid = paidAtBaseline * budget / baselineSpend;
        } else {
          const scenario = scenarios[state.scenario];
          const k = scenario.halfAtSixMonths * days / 182;
          const extra = budget - baselineSpend;
          const firstSpendSlope = paidAtBaseline / baselineSpend;
          paid = paidAtBaseline + state.marginalRatio * firstSpendSlope * k * Math.log1p(extra / k);
        }
        return { final: account.fans + natural + paid, natural, paid, baselineSpend };
      }
      function svgNode(tag, attrs, content) {
        const node = document.createElementNS(svgNS, tag);
        Object.entries(attrs || {}).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
        if (content !== undefined) node.textContent = content;
        return node;
      }
      function drawChart() {
        const days = periods[state.period].days;
        const width = Math.max(320, Math.round(el(&#x27;chart&#x27;).getBoundingClientRect().width || 680));
        const height = width &lt; 500 ? 345 : 390;
        const left = 65, right = 18, top = 22, bottom = 59;
        const x0 = left, x1 = width - right, y0 = height - bottom, y1 = top;
        const maxResult = Math.max(100000, ...accounts.map(a =&gt; estimate(a, maxBudget, days).final));
        const yMax = Math.ceil(maxResult * 1.05 / 25000) * 25000;
        const x = value =&gt; x0 + value / maxBudget * (x1 - x0);
        const y = value =&gt; y0 - value / yMax * (y0 - y1);
        const svg = svgNode(&#x27;svg&#x27;, { viewBox: `0 0 ${width} ${height}`, role: &#x27;img&#x27;, &#x27;aria-label&#x27;: `${periods[state.period].label}预算与四号期末粉丝数曲线` });
        svg.appendChild(svgNode(&#x27;title&#x27;, {}, &#x27;预算与期末粉丝数&#x27;));
        svg.appendChild(svgNode(&#x27;desc&#x27;, {}, &#x27;横轴为单号本周期投流预算，纵轴为期末粉丝数。图中的标记表示当前预算，产联社为虚线和菱形标记。&#x27;));
        const xTicks = width &lt; 500 ? [0, 100000, 200000] : [0, 50000, 100000, 150000, 200000];
        xTicks.forEach(value =&gt; {
          const px = x(value);
          svg.appendChild(svgNode(&#x27;line&#x27;, { x1: px, x2: px, y1, y2: y0, class: &#x27;wgu-grid&#x27; }));
          svg.appendChild(svgNode(&#x27;text&#x27;, { x: px, y: y0 + 20, &#x27;text-anchor&#x27;: value === 0 ? &#x27;start&#x27; : value === maxBudget ? &#x27;end&#x27; : &#x27;middle&#x27;, class: &#x27;wgu-tick&#x27; }, `${value / 10000}`));
        });
        const yStep = yMax &lt;= 150000 ? 25000 : 50000;
        for (let value = 0; value &lt;= yMax; value += yStep) {
          const py = y(value);
          svg.appendChild(svgNode(&#x27;line&#x27;, { x1: x0, x2: x1, y1: py, y2: py, class: &#x27;wgu-grid&#x27; }));
          svg.appendChild(svgNode(&#x27;text&#x27;, { x: x0 - 9, y: py + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;wgu-tick&#x27; }, `${(value / 10000).toFixed(value % 10000 ? 1 : 0)}`));
        }
        [50000, 100000].forEach(value =&gt; {
          const py = y(value);
          svg.appendChild(svgNode(&#x27;line&#x27;, { x1: x0, x2: x1, y1: py, y2: py, class: &#x27;wgu-target&#x27; }));
          svg.appendChild(svgNode(&#x27;text&#x27;, { x: x1 - 5, y: py - 5, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;wgu-tick&#x27; }, `${value / 10000}万目标`));
        });
        svg.appendChild(svgNode(&#x27;rect&#x27;, { x: x0, y: y1, width: x1 - x0, height: y0 - y1, fill: &#x27;none&#x27;, stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 1, &#x27;data-chart-frame&#x27;: &#x27;&#x27; }));
        [...accounts].sort((a, b) =&gt; Number(a.id === &#x27;chan&#x27;) - Number(b.id === &#x27;chan&#x27;)).forEach(account =&gt; {
          const points = [];
          for (let budget = 0; budget &lt;= maxBudget; budget += 2000) {
            points.push(`${budget === 0 ? &#x27;M&#x27; : &#x27;L&#x27;}${x(budget).toFixed(1)},${y(estimate(account, budget, days).final).toFixed(1)}`);
          }
          const pathAttrs = { d: points.join(&#x27; &#x27;), fill: &#x27;none&#x27;, stroke: account.tone, &#x27;stroke-width&#x27;: 2.8, &#x27;stroke-linecap&#x27;: &#x27;round&#x27; };
          if (account.id === &#x27;chan&#x27;) pathAttrs[&#x27;stroke-dasharray&#x27;] = &#x27;8 5&#x27;;
          svg.appendChild(svgNode(&#x27;path&#x27;, pathAttrs));
          const result = estimate(account, state.budgets[account.id], days);
          const cx = x(state.budgets[account.id]), cy = y(result.final);
          const hint = `${account.name}：预算 ${money(state.budgets[account.id])}，期末约 ${fansText(result.final)}`;
          if (account.id === &#x27;chan&#x27;) svg.appendChild(svgNode(&#x27;rect&#x27;, { x: cx - 5, y: cy - 5, width: 10, height: 10, transform: `rotate(45 ${cx} ${cy})`, fill: account.tone, stroke: &#x27;var(--background)&#x27;, &#x27;stroke-width&#x27;: 2, &#x27;data-tooltip&#x27;: hint }));
          else svg.appendChild(svgNode(&#x27;circle&#x27;, { cx, cy, r: 6, fill: account.tone, stroke: &#x27;var(--background)&#x27;, &#x27;stroke-width&#x27;: 2, &#x27;data-tooltip&#x27;: hint }));
        });
        svg.appendChild(svgNode(&#x27;text&#x27;, { x: (x0 + x1) / 2, y: height - 10, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;wgu-axis&#x27;, &#x27;data-axis&#x27;: &#x27;x&#x27; }, `单号${periods[state.period].label}投流预算（万元）`));
        svg.appendChild(svgNode(&#x27;text&#x27;, { x: 16, y: (y0 + y1) / 2, transform: `rotate(-90 16 ${(y0 + y1) / 2})`, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;wgu-axis&#x27;, &#x27;data-axis&#x27;: &#x27;y&#x27; }, &#x27;期末粉丝数（万）&#x27;));
        el(&#x27;chart&#x27;).replaceChildren(svg);
      }
      function render() {
        const total = Object.values(state.budgets).reduce((sum, value) =&gt; sum + value, 0);
        const days = periods[state.period].days;
        const results = accounts.map(a =&gt; ({ account: a, result: estimate(a, state.budgets[a.id], days) }));
        root.querySelectorAll(&#x27;[data-period]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(Number(button.dataset.period) === state.period)));
        el(&#x27;natural&#x27;).value = String(state.naturalShare);
        el(&#x27;marginal&#x27;).value = String(state.marginalRatio);
        el(&#x27;scenario&#x27;).value = state.scenario;
        el(&#x27;total&#x27;).textContent = money(total);
        el(&#x27;budget-note&#x27;).textContent = `本页只测四个有历史数据的账号；未含汽车号。六个月四号固定首投约 4.16 万元`;
        el(&#x27;five&#x27;).textContent = `${results.filter(x =&gt; x.result.final &gt;= 50000).length} / 4`;
        el(&#x27;ten&#x27;).textContent = `${results.filter(x =&gt; x.result.final &gt;= 100000).length} / 4`;
        results.forEach(({ account, result }) =&gt; {
          const budget = state.budgets[account.id];
          const slider = el(account.id);
          slider.value = String(budget);
          slider.style.setProperty(&#x27;--fill&#x27;, `${budget / maxBudget * 100}%`);
          slider.setAttribute(&#x27;aria-valuetext&#x27;, money(budget));
          el(`${account.id}-value`).textContent = money(budget);
          el(`${account.id}-result`).textContent = `期末约 ${fansText(result.final)} · 本周期每篇 100 元基线 ${money(result.baselineSpend)}`;
          [6, 9, 12].forEach(months =&gt; {
            el(`${account.id}-${months}`).textContent = fansText(estimate(account, budget, periods[months].days).final);
          });
        });
        el(&#x27;note&#x27;).textContent = `数据截至 2026-09-26。万联万象使用 9/1—9/20 开蓉蓉主笔期：16 篇为开蓉蓉、1 篇为其他作者，整号净增 1,550；多空 9/1—9/26 净增 1,288；产联社只用解除限流后的 9/17—9/26 净增 118；新质 9/1—9/26 净增 472。曲线在每篇可投文章固定 100 元处接续现速（自然＋投流＋后续推荐），不是单独的广告获粉。按约 20% 文章不可投，6／9／12 个月每号预计 104／156／209 篇可投。低于首投基线时的自然净增占比、追加的第一个 100 元效率及后续降效速度均为假设；最新投流表没有单篇超过 100 元的实验数据，不能据此认定第二个 100 元的真实效率。汽车号没有历史数据，产联智库暂不列入投流赛马。`;
        drawChart();
      }
      function saveState() {
        if (!window.openai || !window.openai.setWidgetState) return;
        window.openai.setWidgetState({ modelContent: { period: state.period, naturalShare: state.naturalShare, marginalRatio: state.marginalRatio, scenario: state.scenario, budgets: state.budgets }, privateContent: null }).catch(() =&gt; {});
      }
      function applySaved(saved) {
        if (!saved || typeof saved !== &#x27;object&#x27; || !saved.modelContent) return;
        const data = saved.modelContent;
        if (periods[data.period]) state.period = Number(data.period);
        if ([0, 0.25, 0.5, 0.75].includes(Number(data.naturalShare))) state.naturalShare = Number(data.naturalShare);
        if ([0, 0.25, 0.5, 1].includes(Number(data.marginalRatio))) state.marginalRatio = Number(data.marginalRatio);
        if (scenarios[data.scenario]) state.scenario = data.scenario;
        if (data.budgets &amp;&amp; typeof data.budgets === &#x27;object&#x27;) accounts.forEach(a =&gt; {
          const value = Number(data.budgets[a.id]);
          if (Number.isFinite(value)) state.budgets[a.id] = Math.min(maxBudget, Math.max(0, Math.round(value / 100) * 100));
        });
        render();
      }
      accounts.forEach(account =&gt; {
        const row = document.createElement(&#x27;div&#x27;);
        row.className = &#x27;wgu-control&#x27;;
        row.style.setProperty(&#x27;--tone&#x27;, account.tone);
        row.innerHTML = `&lt;div class=&quot;wgu-control-head&quot;&gt;&lt;label class=&quot;wgu-control-name&quot; for=&quot;wgu-${account.id}&quot;&gt;&lt;i class=&quot;wgu-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${account.name}&lt;/label&gt;&lt;output class=&quot;wgu-control-value tabular-nums&quot; id=&quot;wgu-${account.id}-value&quot;&gt;&lt;/output&gt;&lt;/div&gt;&lt;input class=&quot;wgu-slider cursor-interaction&quot; id=&quot;wgu-${account.id}&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;200000&quot; step=&quot;100&quot; aria-label=&quot;${account.name}三周期共用投流预算&quot;&gt;&lt;div class=&quot;wgu-control-result text-small tabular-nums&quot; id=&quot;wgu-${account.id}-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;`;
        el(&#x27;controls&#x27;).appendChild(row);
        const input = row.querySelector(&#x27;input&#x27;);
        input.addEventListener(&#x27;input&#x27;, () =&gt; { state.budgets[account.id] = Number(input.value); render(); });
        input.addEventListener(&#x27;change&#x27;, saveState);
        const tr = document.createElement(&#x27;tr&#x27;);
